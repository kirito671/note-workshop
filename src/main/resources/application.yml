server:
  port: 8080

spring:
  application:
    name: note-workshop
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/note_workshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:note_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000

mybatis-plus:
  type-aliases-package: com.example.noteworkshop.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:45}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-avatar-size-bytes: ${MAX_AVATAR_SIZE_BYTES:5242880}
    max-note-image-size-bytes: ${MAX_NOTE_IMAGE_SIZE_BYTES:5242880}
    max-note-image-count: ${MAX_NOTE_IMAGE_COUNT:6}

logging:
  level:
    root: INFO
    com.example.noteworkshop: INFO
  file:
    name: logs/note-workshop.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB